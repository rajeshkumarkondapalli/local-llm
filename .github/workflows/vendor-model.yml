name: Vendor Model

on:
  # workflow_dispatch only becomes callable via the API once a workflow
  # file is on the repo's default branch, which this repo doesn't have
  # this work on yet. Trigger via push instead, scoped to this file, so
  # pushing a change to this workflow (even just a trigger touch) is
  # enough to fire it on this branch.
  push:
    branches:
      - claude/offline-local-lm-python-cdhy6p
    paths:
      - ".github/workflows/vendor-model.yml"
  workflow_dispatch:
    inputs:
      repo:
        description: "Hugging Face repo id"
        required: false
        default: "bartowski/SmolLM2-135M-Instruct-GGUF"
      filename:
        description: "GGUF filename in the repo"
        required: false
        default: "SmolLM2-135M-Instruct-Q4_K_S.gguf"

permissions:
  contents: write

jobs:
  vendor-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Download model
        env:
          MODEL_REPO: ${{ inputs.repo || 'bartowski/SmolLM2-135M-Instruct-GGUF' }}
          MODEL_FILENAME: ${{ inputs.filename || 'SmolLM2-135M-Instruct-Q4_K_S.gguf' }}
        run: |
          python3 scripts/download_model.py \
            --repo "$MODEL_REPO" \
            --filename "$MODEL_FILENAME"

      - name: Commit and push
        env:
          MODEL_REPO: ${{ inputs.repo || 'bartowski/SmolLM2-135M-Instruct-GGUF' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/model.gguf
          if git diff --cached --quiet; then
            echo "No changes to commit (model already up to date)."
          else
            git commit -m "Vendor local model weights ($MODEL_REPO)"
            git push
          fi
